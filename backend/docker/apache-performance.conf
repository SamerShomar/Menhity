# Conservative pool for small containers. Tune after measuring peak RSS.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 1
    MaxSpareServers 2
    ServerLimit 4
    MaxRequestWorkers 4
    MaxConnectionsPerChild 500
</IfModule>

KeepAlive On
KeepAliveTimeout 2
MaxKeepAliveRequests 100

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE application/json text/html text/plain text/css application/javascript image/svg+xml
</IfModule>
